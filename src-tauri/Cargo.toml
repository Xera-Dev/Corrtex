[package]
name = "corrtex"
version = "0.2.0"
description = "Corrtex - navigateur léger"
edition = "2021"

[[bin]]
name = "corrtex"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }

# Accès direct au moteur WebView2 (gestion des extensions Chrome)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[features]
# Permet de compiler avec un simple `cargo build --release` (sans tauri-cli)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
