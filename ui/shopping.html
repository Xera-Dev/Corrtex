<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Recherche d'achat</title>
<script src="common.js"></script>
<script src="shop-parse.js"></script>
</head>
<body>
  <!-- Moteur de la recherche d'achat de l'agent (vue cachée, une par fenêtre).
       L'affichage se fait dans la page de l'onglet (panneau en verre, tab_script.js) :
       chaque changement est envoyé à Corrtex (shopping_push), les boutons reviennent ici
       (window.__corrtexShoppingAction). La recherche continue quand on change d'onglet. -->
  <script>
  (function () {
    const C = window.Corrtex, S = window.CorrtexShop;
    const eur = (n) => n == null ? '' : n.toLocaleString('fr-FR', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }) + ' €';
    const fetchPage = (url) => window.__TAURI__.core.invoke('shop_fetch', { url });

    // ------------------------------------------------------------ IA (page d'IA cachée, sans clé d'API)
    let aiSeq = 0;
    const aiWait = {};
    window.__corrtexShopAI = (req, text, done, error) => {
      const w = aiWait[req];
      if (!w) return;
      w.text = text || w.text;
      if (done || error) {
        delete aiWait[req];
        clearTimeout(w.timer);
        if (error && !w.text) w.reject('pas de réponse de l’IA'); else w.resolve(w.text);
      }
    };
    function ask(prompt) {
      return new Promise((resolve, reject) => {
        const req = 'sp' + Date.now().toString(36) + (++aiSeq);
        aiWait[req] = { resolve, reject, text: '', timer: setTimeout(() => { delete aiWait[req]; reject('délai dépassé'); }, 100000) };
        C.invoke('shop_ask_ai', { prompt, req }).catch((e) => { delete aiWait[req]; reject(String(e)); });
      });
    }
    // premier objet JSON de la réponse (l'IA ajoute parfois du texte ou des balises de code)
    function json(text) {
      const t = String(text || '').replace(/```(?:json)?/g, '');
      const i = t.indexOf('{');
      if (i < 0) return null;
      const r = S.grab(t, '{', i);
      return r ? r.value : null;
    }

    // ------------------------------------------------------------ état de la recherche
    let job = null, busy = false, steps = [];
    const blank = (goal) => ({ hid: Date.now(), goal, time: Math.floor(Date.now() / 1000), refinements: [], queriesDone: [], cands: {}, rounds: [], suggestions: [], next: [], plan: null });
    function brief() {
      let s = '« ' + job.goal + ' »';
      if (job.refinements.length) s += '\nPrécisions données ensuite par l’utilisateur :\n' + job.refinements.map((r) => '- ' + r).join('\n');
      return s;
    }

    // ce que le panneau de la page affiche
    function view() {
      const P = job.plan || {};
      const tags = job.refinements.slice();
      if (P.budget_max) tags.push('Budget ≤ ' + eur(P.budget_max));
      (P.must || []).slice(0, 4).forEach((m) => tags.push(m));
      return {
        hid: job.hid, goal: job.goal, summary: P.summary || '', tags, busy, steps,
        suggestions: job.suggestions || [],
        rounds: job.rounds.map((r) => ({ title: r.title, advice: r.advice || '', empty: !!r.empty, items: r.picks.map((p) => item(p)).filter(Boolean) })),
      };
    }
    function item(p) {
      const c = job.cands[p.id];
      if (!c) return null;
      const best = c.offers && c.offers[0];
      return { id: c.id, name: c.name, image: c.image || '', url: c.ext ? 'https://ledenicheur.fr/search?query=' + encodeURIComponent(c.name) : c.url, price: best ? best.price : c.low != null ? c.low : c.price,
        shop: best ? best.shop : '', stock: best ? !!best.stock : false, offer: best ? best.url : '', rating: c.rating || null, reviews: c.reviews || 0,
        offers: c.offerCount || 0, trend: c.trend || null, why: p.why || '', timing: p.timing || 'ok' };
    }
    let pushT = 0;
    function publish(now) {
      clearTimeout(pushT);
      const go = () => C.invoke('shopping_push', { view: view() }).catch(() => {});
      if (now) go(); else pushT = setTimeout(go, 120);
    }
    // enregistrement : la recherche complète (pour continuer) et une version courte pour l'historique
    function save() {
      const keep = {};
      job.rounds.forEach((r) => r.picks.forEach((p) => { if (job.cands[p.id]) keep[p.id] = job.cands[p.id]; }));
      const lines = [];
      job.rounds.forEach((r) => r.picks.forEach((p) => {
        const it = item(p);
        if (it && lines.length < 5) lines.push((lines.length + 1) + '. ' + it.name + (it.price != null ? ' — ' + eur(it.price) : '') + (it.shop ? ' chez ' + it.shop : ''));
      }));
      const record = { id: job.hid, kind: 'shopping', goal: job.goal, time: job.time, answer: lines.join('\n') || (job.rounds[0] && job.rounds[0].advice) || 'Aucun article trouvé',
        data: Object.assign({}, job, { cands: keep, fresh: false }) };
      C.invoke('shopping_save', { data: Object.assign({}, job, { fresh: false, record }) }).catch(() => {});
    }

    // étapes affichées pendant la recherche
    function step(text) {
      const s = { t: text, s: 'run' };
      steps.push(s);
      publish();
      return {
        ok(t) { s.s = 'ok'; if (t) s.t = t; publish(); },
        fail(t) { s.s = 'err'; if (t) s.t = t; publish(); },
      };
    }

    // 1. la demande devient des recherches précises pour le comparateur
    async function plan(more) {
      const st = step(more ? 'L’IA cherche d’autres pistes…' : 'L’IA analyse la demande…');
      const prompt = 'Tu aides à trouver le meilleur article à acheter en France. Demande de l’utilisateur : ' + brief() + '\n\n' +
        (more ? 'Recherches déjà faites : ' + job.queriesDone.join(' ; ') + '\nArticles déjà proposés : ' + shownNames().join(' ; ') +
          '\nPropose de NOUVELLES recherches, différentes des précédentes (autres marques, autres modèles, autres gammes de prix).\n\n' : '') +
        'Réponds UNIQUEMENT par un objet JSON, sans aucun texte autour :\n' +
        '{"summary":"la demande reformulée en une phrase courte","queries":["3 ou 4 recherches courtes pour le comparateur de prix leDénicheur : de préférence des modèles précis (marque + modèle) réputés pour cette demande, sinon la catégorie avec ses caractéristiques clés"],"budget_min":null,"budget_max":null,"must":["caractéristiques indispensables, en quelques mots"],"avoid":["mots qui signalent un mauvais résultat, par ex. accessoires"]}\n' +
        'budget_min et budget_max sont des nombres en euros, ou null s’ils ne sont pas donnés.';
      let p = null;
      try { p = json(await ask(prompt)); } catch (e) {}
      if (!p || !Array.isArray(p.queries) || !p.queries.length) {
        // sans réponse de l'IA : la demande elle-même, débarrassée des mots inutiles
        const q = job.goal.replace(/\b(trouve|trouver|cherche|chercher|moi|je|un|une|des|le|la|les|meilleur|meilleure|pas cher|moins de|à|a|pour|acheter)\b/gi, ' ').replace(/\d+\s*(€|euros?)/gi, ' ').replace(/\s+/g, ' ').trim();
        const budget = (job.goal.match(/(\d+)\s*(€|euros?)/i) || [])[1];
        p = { summary: '', queries: [q || job.goal], budget_max: budget ? +budget : null, must: [], avoid: [] };
        st.fail('IA indisponible : recherche directe');
      } else st.ok(more ? 'Nouvelles pistes : ' + p.queries.length + ' recherches' : 'Demande analysée : ' + p.queries.length + ' recherches');
      const q = p.queries.map((x) => String(x).trim()).filter((x) => x && job.queriesDone.indexOf(x) < 0).slice(0, 4);
      if (!more || !job.plan) job.plan = { summary: p.summary || '', budget_min: num(p.budget_min), budget_max: num(p.budget_max), must: arr(p.must), avoid: arr(p.avoid) };
      return q;
    }
    const num = (v) => (typeof v === 'number' && v > 0 ? v : null);
    const arr = (v) => (Array.isArray(v) ? v.map(String).filter(Boolean).slice(0, 8) : []);

    // 2. recherches sur le comparateur
    async function search(queries) {
      for (const q of queries) {
        const st = step('Recherche « ' + q + ' » sur leDénicheur…');
        try {
          const list = S.parseSearch(await fetchPage('https://ledenicheur.fr/search?query=' + encodeURIComponent(q)));
          let n = 0;
          list.forEach((c) => {
            if (job.cands[c.id]) return;
            c.q = q;
            job.cands[c.id] = c;
            n++;
          });
          st.ok('« ' + q + ' » : ' + list.length + ' produit' + (list.length > 1 ? 's' : '') + (n < list.length ? ' (' + n + ' nouveaux)' : ''));
        } catch (e) { st.fail('« ' + q + ' » : ' + e); }
        job.queriesDone.push(q);
      }
      await searchShops(queries);
    }

    // 2 bis. boutiques ajoutées dans les réglages : les deux premières recherches sur chacune
    async function searchShops(queries) {
      const sites = ((await C.invoke('shop_sites_get').catch(() => [])) || []).filter((s) => s.on).slice(0, 12);
      if (!sites.length || !queries.length) return;
      const tasks = [];
      sites.forEach((site) => queries.slice(0, 2).forEach((q) => tasks.push([site, q])));
      const one = async (site, q) => {
        const st = step('Recherche « ' + q + ' » sur ' + site.name + '…');
        const url = site.search.split('{q}').join(encodeURIComponent(q));
        try {
          const list = S.parseShopGeneric(await fetchPage(url), url);
          let n = 0;
          list.forEach((c) => {
            const id = 'x' + S.norm(site.name + ' ' + c.name).replace(/ /g, '').slice(0, 80);
            if (job.cands[id]) return;
            // pas de suivi des prix pour une boutique seule : son prix est l'offre
            job.cands[id] = Object.assign(c, { id, q, ext: site.name, enriched: true, low: c.price, offerCount: 1, trend: null,
              offers: c.price != null ? [{ shop: site.name, price: c.price, url: c.url, stock: true }] : [] });
            n++;
          });
          if (list.length) st.ok(site.name + ' · « ' + q + ' » : ' + list.length + ' produit' + (list.length > 1 ? 's' : '') + (n < list.length ? ' (' + n + ' nouveaux)' : ''));
          else st.fail(site.name + ' · « ' + q + ' » : aucun article lisible (la page se construit peut-être en JavaScript)');
        } catch (e) { st.fail(site.name + ' · « ' + q + ' » : ' + e); }
      };
      await Promise.all([0, 1, 2].map(async () => { while (tasks.length) { const t = tasks.shift(); await one(t[0], t[1]); } }));
    }

    // accessoires (pas les mots « pour », « compatible »… trop courants dans les noms de produits)
    const ACC = /\b(housse|coque|etui|étui|coussinets?|oreillettes? de rechange|embouts?|cable|câble|chargeur|support|protection|film|adaptateur|remplacement|replacement|pochette|sacoche|bracelet|skin|grip|tapis)\b/i;
    // pré-tri avant le suivi des prix : pertinence, budget, notes ; accessoires écartés
    function prescore(c) {
      const P = job.plan || {};
      const text = job.goal + ' ' + job.refinements.join(' ');
      if (ACC.test(c.name) && !ACC.test(text)) return -1;
      if ((P.avoid || []).some((w) => w && S.norm(c.name).indexOf(S.norm(w)) >= 0)) return -1;
      let s = Math.max(S.score(c.q || '', c.name), 0) * 2;
      if (c.price != null && P.budget_max && c.price > P.budget_max * 1.08) return -1;
      if (c.price != null && P.budget_min && c.price < P.budget_min * 0.7) s -= 0.5;
      if (c.rating) s += (c.rating - 3) * 0.4 + Math.min(Math.log10((c.reviews || 0) + 1), 3) * 0.25;
      if (c.price == null) s -= 0.6;
      return s;
    }

    // 3. suivi des prix : offres et historique de chaque article retenu
    function trend(hist, low) {
      if (!hist || hist.length < 2) return null;
      // l'historique ne contient que les changements de prix : chaque prix vaut jusqu'au suivant
      const day = {};
      hist.forEach((h) => { const d = Math.floor(h.t / 864e5); if (day[d] == null || h.price < day[d]) day[d] = h.price; });
      const known = Object.keys(day).map(Number).sort((a, b) => a - b);
      const today = Math.floor(Date.now() / 864e5), from = Math.max(known[0], today - 90);
      let k = 0, cur = null;
      while (k < known.length && known[k] <= from) cur = day[known[k++]];
      const pts = [];
      for (let d = from; d <= today; d++) {
        while (k < known.length && known[k] <= d) cur = day[known[k++]];
        if (cur != null) pts.push(cur);
      }
      if (pts.length < 2) return null;
      const now = low != null ? low : pts[pts.length - 1];
      pts[pts.length - 1] = now;
      const min = Math.min(...pts), max = Math.max(...pts), avg = pts.reduce((a, b) => a + b, 0) / pts.length;
      const stepN = Math.max(1, Math.ceil(pts.length / 40));
      const series = pts.filter((x, i) => i % stepN === 0 || i === pts.length - 1).map((x) => Math.round(x * 100) / 100);
      return { min, max, avg: Math.round(avg * 100) / 100, cur: now, days: pts.length - 1, vsAvg: Math.round((now - avg) / avg * 100), atLow: now <= min * 1.02 && max > min * 1.03, series };
    }
    async function enrich(list) {
      const st = step('Suivi des prix de ' + list.length + ' article' + (list.length > 1 ? 's' : '') + '…');
      let done = 0;
      const one = async (c) => {
        try {
          const d = S.parseProduct(await fetchPage(c.url));
          c.low = d.low != null ? d.low : c.price;
          c.offerCount = d.offerCount || d.offers.length;
          c.offers = d.offers.slice(0, 3).map((o) => ({ shop: o.shop, price: o.price, url: o.url, stock: o.stock }));
          c.trend = trend(d.history, c.low);
        } catch (e) { c.low = c.price; }
        c.enriched = true;
        st.ok('Suivi des prix : ' + (++done) + ' / ' + list.length);
      };
      const queue = list.slice();
      await Promise.all([0, 1, 2].map(async () => { while (queue.length) await one(queue.shift()); }));
      st.ok('Prix suivis sur ' + list.length + ' article' + (list.length > 1 ? 's' : ''));
    }

    // 4. l'IA choisit les meilleurs avec les prix et leur évolution
    async function rank(list) {
      const st = step('L’IA compare les articles et leurs prix…');
      const rows = list.map((c, i) => {
        const t = c.trend;
        return i + ' | ' + c.name + ' | ' + (c.low != null ? eur(c.low) : '?') + ' | ' + (c.ext ? 'boutique ' + c.ext : (c.offerCount || 0) + ' marchands') + ' | ' +
          (c.rating ? c.rating + '/5 (' + (c.reviews || 0) + ' avis)' : 'pas de note') + ' | ' +
          (t ? 'mini ' + eur(t.min) + ', moyen ' + eur(t.avg) + ', maxi ' + eur(t.max) + ' sur ' + t.days + ' jours, ' + (t.vsAvg > 0 ? '+' : '') + t.vsAvg + ' % par rapport au prix moyen' + (t.atLow ? ', au plus bas' : '') : c.ext ? 'prix d’une seule boutique, pas d’historique' : 'pas d’historique');
      });
      const prompt = 'Demande d’achat : ' + brief() + '\n' +
        (job.plan && (job.plan.must.length || job.plan.budget_max) ? 'Critères : ' + job.plan.must.join(', ') + (job.plan.budget_max ? ' ; budget maximum ' + eur(job.plan.budget_max) : '') + '\n' : '') +
        '\nVoici des articles trouvés sur le comparateur leDénicheur (avec le suivi de leur prix sur les derniers mois) et sur des boutiques en ligne :\n' +
        'n | nom | prix le plus bas actuel | marchands ou boutique | note | évolution du prix\n' + rows.join('\n') + '\n\n' +
        'Choisis les 5 meilleurs articles pour cette demande (moins s’il y en a peu de pertinents), du meilleur au moins bon, ' +
        'en tenant compte de la correspondance avec la demande, de la qualité (notes, nombre d’avis), du prix et de son évolution : ' +
        'un prix au plus bas ou nettement sous sa moyenne est un bon moment pour acheter, un prix au-dessus de sa moyenne peut inciter à attendre. ' +
        'Écarte les articles hors sujet ou hors budget.\n' +
        'Réponds UNIQUEMENT par un objet JSON, sans aucun texte autour :\n' +
        '{"picks":[{"n":0,"why":"pourquoi cet article, en une ou deux phrases concrètes","timing":"buy | wait | ok"}],"advice":"conseil d’ensemble en deux phrases au plus","refine":["2 à 4 précisions utiles que l’utilisateur pourrait donner, formulées comme des choix très courts, par ex. « Plutôt intra-auriculaire »"],"next":["2 ou 3 nouvelles recherches pour continuer"]}';
      let r = null;
      try { r = json(await ask(prompt)); } catch (e) {}
      if (!r || !Array.isArray(r.picks)) {
        const sorted = list.slice().sort((a, b) => prescore(b) + (b.trend && b.trend.atLow ? 0.3 : 0) - prescore(a) - (a.trend && a.trend.atLow ? 0.3 : 0));
        r = { picks: sorted.slice(0, 5).map((c) => ({ n: list.indexOf(c), why: '', timing: c.trend && c.trend.atLow ? 'buy' : 'ok' })), advice: '', refine: [], next: [] };
        st.fail('IA indisponible : classement par notes et prix');
      } else st.ok('Sélection faite');
      const picks = [];
      r.picks.forEach((p) => {
        const c = list[+p.n];
        if (c && !picks.some((x) => x.id === c.id)) picks.push({ id: c.id, why: String(p.why || ''), timing: /^(buy|wait|ok)$/.test(p.timing) ? p.timing : 'ok' });
      });
      return { picks: picks.slice(0, 5), advice: String(r.advice || ''), refine: arr(r.refine).slice(0, 4), next: arr(r.next).slice(0, 3) };
    }

    const shownIds = () => job.rounds.reduce((a, r) => a.concat(r.picks.map((p) => p.id)), []);
    const shownNames = () => shownIds().map((id) => job.cands[id] && job.cands[id].name).filter(Boolean).slice(0, 20);

    // une recherche complète : « new » (première ou précisée) ou « more » (continuer)
    async function run(mode) {
      if (busy || !job) return;
      busy = true;
      steps = [];
      if (mode === 'new') job.rounds = [];
      publish(true);
      try {
        let queries = mode === 'more' && job.next && job.next.length ? job.next.filter((q) => job.queriesDone.indexOf(q) < 0) : [];
        if (!queries.length) queries = await plan(mode === 'more');
        await search(queries);
        // tous les articles connus (les précisions réutilisent ceux déjà trouvés), hors déjà proposés si on continue
        const skip = mode === 'more' ? shownIds() : [];
        let pool = Object.values(job.cands).filter((c) => skip.indexOf(c.id) < 0).map((c) => [prescore(c), c]).filter((x) => x[0] >= 0);
        pool.sort((a, b) => b[0] - a[0]);
        pool = pool.slice(0, 10).map((x) => x[1]);
        if (!pool.length) {
          job.rounds.push({ title: mode === 'more' ? 'Rien de nouveau' : 'Aucun article', picks: [], empty: true,
            advice: mode === 'more' ? 'Pas d’autre article pertinent trouvé. Essayez de préciser la recherche.' : 'Aucun article ne correspond. Précisez la recherche (autre formulation, budget, marque…).' });
        } else {
          const need = pool.filter((c) => !c.enriched);
          if (need.length) await enrich(need);
          const r = await rank(pool);
          job.rounds.push({ title: mode === 'more' ? 'Autres articles' : job.refinements.length ? 'Meilleurs articles après précision' : 'Meilleurs articles', picks: r.picks, advice: r.advice });
          job.suggestions = r.refine;
          job.next = r.next;
        }
      } catch (e) {
        step('Erreur : ' + e).fail();
      }
      busy = false;
      publish(true);
      save();
    }

    // ------------------------------------------------------------ boutons du panneau de la page
    window.__corrtexShoppingAction = (a) => {
      if (!a || !job) return;
      if (a.action === 'more') run('more');
      else if (a.action === 'refine') {
        const all = (a.texts || []).map((t) => String(t).trim().slice(0, 200)).filter(Boolean);
        if (!all.length) return;
        job.refinements = job.refinements.concat(all).slice(-8);
        job.next = [];
        run('new');
      } else if (a.action === 'show') publish(true);
    };

    // ------------------------------------------------------------ démarrage (et nouvelle demande)
    async function load() {
      const j = await C.invoke('shopping_job').catch(() => null);
      if (!j || !j.goal) return;
      steps = [];
      if (j.fresh) {
        job = blank(j.goal);
        run('new');
      } else {
        job = Object.assign(blank(j.goal), j);
        delete job.record;
        publish(true);
      }
    }
    window.__corrtexShoppingReload = () => { if (!busy) load(); else setTimeout(window.__corrtexShoppingReload, 1500); };
    load();
  })();
  </script>
</body>
</html>
