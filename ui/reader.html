<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Article — Corrtex</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="theme.css">
<script src="common.js"></script>
<style>
  /* Article de la recherche IA, détaché dans sa propre fenêtre */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--page-2); }
  body { min-height: 100vh; color: var(--fg); font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(70% 50% at 20% 0%, color-mix(in srgb, var(--l1, #ff4f7b) 28%, transparent), transparent 70%),
                radial-gradient(60% 50% at 100% 10%, color-mix(in srgb, var(--l3, #c86bff) 22%, transparent), transparent 70%),
                linear-gradient(180deg, var(--page-1), var(--page-2)) fixed; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 28px 48px; }
  .sheet { padding: 26px 30px; border-radius: 24px; background: var(--card); border: 1px solid var(--glass-border);
    box-shadow: 0 20px 50px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.08); }
  a { color: inherit; }
  .ai-src { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .ai-src a { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px 0 7px; border-radius: 15px; font-size: 12.5px; text-decoration: none;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); }
  .ai-src a b { display: grid; place-items: center; min-width: 16px; height: 16px; border-radius: 5px; font-size: 10.5px; background: color-mix(in srgb, var(--l1, #ff4f7b) 35%, transparent); }
  .ai-src a img { width: 16px; height: 16px; border-radius: 4px; }
  .ai-src .lbl { font-size: 12px; color: var(--fg-dim); align-self: center; }
  .news a.cite { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; margin: 0 1px; border-radius: 6px; font: 700 11px/1 "Segoe UI", sans-serif;
    vertical-align: 2px; background: color-mix(in srgb, var(--l1, #ff4f7b) 30%, transparent); text-decoration: none; }
  .news figure img { max-height: 380px; }
  .news h1 { font-size: 34px; }
  .news .body { font-size: 17px; }
  .news .caret, .news .note { display: none; }
/* ------------------------------------------------ réponse en article de journal */
.news { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
.news figure { margin: 0 0 14px; border-radius: 16px; overflow: hidden; position: relative; background: rgba(255,255,255,.06); }
.news figure img { display: block; width: 100%; max-height: 210px; object-fit: cover; animation: aiIn .4s ease; }
.news figcaption { position: absolute; right: 8px; bottom: 8px; font: 11px/1 "Segoe UI", system-ui, sans-serif; padding: 4px 8px; border-radius: 8px; background: rgba(0,0,0,.55); color: #fff; }
.news .kicker { font: 600 11.5px/1.2 "Segoe UI", system-ui, sans-serif; letter-spacing: .6px; text-transform: uppercase; color: var(--l1, #ff4f7b); }
.news h1 { font-size: 27px; line-height: 1.18; font-weight: 700; margin: 8px 0 0; letter-spacing: -.3px; }
.news .lede { margin-top: 10px; font-size: 16.5px; line-height: 1.5; font-style: italic; color: color-mix(in srgb, var(--fg) 88%, transparent);
  padding-left: 12px; border-left: 3px solid var(--l1, #ff4f7b); }
.news .body { margin-top: 12px; font-size: 15.5px; line-height: 1.62; }
.news .body h3 { font: 700 13px/1.3 "Segoe UI", system-ui, sans-serif; text-transform: uppercase; letter-spacing: .5px; margin: 16px 0 6px; color: var(--fg); }
.news .body p + p { margin-top: 8px; }
.news .body p.first::first-letter { float: left; font-size: 3.2em; line-height: 1; font-weight: 700; margin: 2px 8px 0 0; color: var(--l1, #ff4f7b); }
.news .body h3.keep { margin-top: 18px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.18); }
.news .body ul { padding-left: 0; list-style: none; }
.news .body li { position: relative; padding-left: 18px; margin-top: 5px; font-family: "Segoe UI", system-ui, sans-serif; font-size: 14.5px; }
.news .body li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 7px; height: 7px; border-radius: 2px; background: var(--l1, #ff4f7b); }
.news .caret { display: inline-block; width: 8px; height: 1em; vertical-align: -2px; margin-left: 2px; background: var(--fg); animation: dots 1s steps(2) infinite; opacity: .6; }
@keyframes dots { 50% { opacity: 0; } }

/* article sur une personne : portrait et fiche à droite */
/* la fiche flotte à droite : la biographie s'écrit à côté puis dessous (pas de grand vide) */
.news.person { display: flow-root; }
.news.person .ptop { display: block; }
.news.person .pcard { float: right; width: 236px; margin: 0 0 14px 22px; }
.pcard { border-radius: 18px; padding: 12px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.18); font-family: "Segoe UI", system-ui, sans-serif; }
.pcard img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; object-position: center 20%; border-radius: 12px; background: rgba(255,255,255,.06); animation: aiIn .4s ease; }
.pcard .pn { margin-top: 10px; font: 700 16px/1.25 Georgia, "Times New Roman", serif; }
.pcard .pd { margin-top: 2px; font-size: 12px; color: var(--fg-dim); line-height: 1.35; }
.pcard dl { margin: 8px 0 0; display: grid; gap: 5px; }
.pcard dt { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--l1, #ff4f7b); }
.pcard dd { margin: 1px 0 0; font-size: 12.5px; line-height: 1.4; }
.pcard .pw { display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--fg); text-decoration: none; opacity: .8; }
.pcard .pw:hover { opacity: 1; }
.news.person .body { margin-top: 16px; }
@media (max-width: 760px) { .news.person .pcard { float: none; width: auto; margin: 0 0 14px; } }

  .news.person .pcard { width: 260px; }
</style>
</head>
<body>
  <main><div class="sheet" id="sheet"></div></main>
  <script>
  (function () {
    const C = window.Corrtex;
    C.applyTheme && C.applyTheme();
    const p = C.prefs ? C.prefs() : {};
    if (/^#[0-9a-f]{6}$/i.test(p.light || '')) document.documentElement.style.setProperty('--l1', p.light);
    window.__TAURI__.core.invoke('reader_get').then((d) => {
      if (!d) return;
      document.title = (d.title || 'Article') + ' — Corrtex';
      document.getElementById('sheet').innerHTML = d.html || '';
    });
    // liens : ouverts dans la fenêtre du navigateur
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[href]');
      if (!a || !/^https?:/.test(a.href)) return;
      e.preventDefault();
      C.invoke('new_tab', { url: a.href });
    });
  })();
  </script>
</body>
</html>
