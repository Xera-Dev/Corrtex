<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Agent voyage – Corrtex</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="theme.css">
<script src="common.js"></script>
<style>
  /* Agent voyage : l'IA (en coulisse, sans clé) propose destinations, transports, hébergements,
     budget et programme ; météo réelle (Open-Meteo) ; liens déjà remplis vers les sites de réservation. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--page-2); }
  body { min-height: 100vh; color: var(--fg); font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, var(--page-1), var(--page-2) 80vh) fixed; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* fond animé (comme l'accueil) */
  #ambient { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .blob { position: absolute; width: 85vmax; height: 85vmax; border-radius: 50%; left: calc(50% - 42.5vmax); top: calc(50% - 42.5vmax);
    background: radial-gradient(circle, var(--c) 0%, color-mix(in srgb, var(--c) 45%, transparent) 28%, transparent 66%);
    opacity: calc(var(--light-strength) * var(--intensity, 1)); will-change: transform; }
  [data-theme="graphite"] .blob, [data-theme="minuit"] .blob, [data-theme="ocean"] .blob { mix-blend-mode: screen; }
  .b1 { --c: var(--l1, #ff4f7b); animation: drift1 34s ease-in-out infinite alternate; }
  .b2 { --c: var(--l2, #ff8a3d); animation: drift2 42s ease-in-out infinite alternate; width: 70vmax; height: 70vmax; }
  .b3 { --c: var(--l3, #c86bff); animation: drift3 51s ease-in-out infinite alternate; width: 60vmax; height: 60vmax; }
  @keyframes drift1 { 0% { transform: translate(-38vw, -30vh); } 50% { transform: translate(24vw, -10vh) scale(1.12); } 100% { transform: translate(-20vw, 30vh); } }
  @keyframes drift2 { 0% { transform: translate(36vw, 28vh); } 50% { transform: translate(-26vw, 10vh) scale(.9); } 100% { transform: translate(24vw, -30vh); } }
  @keyframes drift3 { 0% { transform: translate(6vw, -36vh); } 50% { transform: translate(-34vw, 4vh) scale(1.2); } 100% { transform: translate(34vw, 10vh); } }
  .light-off .blob { opacity: 0; } .paused .blob { animation-play-state: paused; }

  main { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 34px clamp(16px, 4vw, 48px) 80px; }
  .glass { background: var(--card); border: 1px solid var(--glass-border); border-radius: 24px;
    box-shadow: 0 18px 46px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.08); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
  .soft { background: var(--glass); border: 1px solid var(--hover); border-radius: 18px; }

  /* ------------------------------------------------ en-tête */
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .top .ic { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; background: color-mix(in srgb, var(--l1, #ff4f7b) 22%, transparent); color: var(--l1, #ff4f7b); }
  .top .ic svg { width: 26px; height: 26px; }
  .top h1 { font: 700 30px/1.1 'Poppins', "Segoe UI", sans-serif; letter-spacing: -.4px; }
  .top p { color: var(--fg-dim); font-size: 13.5px; }
  .top .sp { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 15px; border-radius: 19px; font-size: 13.5px; font-weight: 600; background: var(--glass); border: 1px solid var(--glass-border); }
  .pill:hover { background: var(--hover); }
  .pill svg { width: 17px; height: 17px; }

  /* ------------------------------------------------ formulaire */
  #form { padding: 22px; }
  #wish { width: 100%; resize: none; min-height: 54px; padding: 14px 18px; border-radius: 18px; outline: 0; font-size: 16px; line-height: 1.45; color: var(--fg);
    background: var(--glass); border: 1px solid var(--glass-border); }
  #wish:focus { border-color: color-mix(in srgb, var(--l1, #ff4f7b) 60%, var(--glass-border)); }
  #wish::placeholder, .f input::placeholder { color: var(--fg-dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 14px; }
  .f { display: flex; flex-direction: column; gap: 5px; }
  .f label { font-size: 11.5px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--fg-dim); }
  .f input, .f select { height: 42px; padding: 0 13px; border-radius: 13px; outline: 0; background: var(--glass); border: 1px solid var(--glass-border); color-scheme: dark light; }
  .f input:focus, .f select:focus { border-color: color-mix(in srgb, var(--l1, #ff4f7b) 60%, var(--glass-border)); }
  .f select option { background: var(--page-2); }
  .row2 { display: flex; gap: 8px; } .row2 input, .row2 select { flex: 1; min-width: 0; width: 100%; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { height: 34px; padding: 0 13px; border-radius: 17px; font-size: 13px; color: var(--fg-dim); background: var(--glass); border: 1px solid var(--hover); display: inline-flex; align-items: center; gap: 6px; }
  .chips button svg { width: 15px; height: 15px; }
  .chips button:hover { color: var(--fg); }
  .chips button.on { color: var(--fg); border-color: color-mix(in srgb, var(--l1, #ff4f7b) 70%, transparent); background: color-mix(in srgb, var(--l1, #ff4f7b) 20%, transparent); }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 16px; }
  .budget { display: flex; align-items: center; gap: 12px; }
  .budget input[type=range] { flex: 1; accent-color: var(--l1, #ff4f7b); }
  .budget output { min-width: 90px; text-align: right; font-weight: 700; }
  .go { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .go .note { flex: 1; font-size: 12.5px; color: var(--fg-dim); }
  .btn { height: 46px; padding: 0 24px; border-radius: 23px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 9px;
    background: linear-gradient(135deg, var(--l1, #ff4f7b), var(--l3, #c86bff)); color: #fff; box-shadow: 0 10px 26px color-mix(in srgb, var(--l1, #ff4f7b) 35%, transparent); }
  .btn:hover { filter: brightness(1.08); } .btn:disabled { opacity: .5; pointer-events: none; }
  .btn svg { width: 19px; height: 19px; }
  .ex { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ex button { font-size: 12.5px; padding: 5px 11px; border-radius: 12px; color: var(--fg-dim); background: transparent; border: 1px dashed var(--glass-border); }
  .ex button:hover { color: var(--fg); border-style: solid; }

  /* ------------------------------------------------ progression */
  #progress { margin-top: 22px; padding: 20px 22px; display: none; }
  #progress.on { display: block; }
  .steps { list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .steps li { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--fg-dim); }
  .steps li::before { content: ""; width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--fg-dim); flex: none; }
  .steps li.ok { color: var(--fg); } .steps li.ok::before { background: #3ddc97; border-color: #3ddc97; }
  .steps li.run { color: var(--fg); } .steps li.run::before { border-color: var(--l1, #ff4f7b); border-top-color: transparent; animation: spin .8s linear infinite; }
  .steps li.err { color: #ff8a9a; } .steps li.err::before { border-color: #ff7a8a; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err-box { margin-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* ------------------------------------------------ résultats */
  #result { margin-top: 24px; display: none; }
  #result.on { display: block; animation: rin .4s ease; }
  @keyframes rin { from { opacity: 0; transform: translateY(8px); } }
  .summary { font-size: 15px; color: color-mix(in srgb, var(--fg) 85%, transparent); margin-bottom: 14px; }
  .dests { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .dest { position: relative; overflow: hidden; min-height: 150px; padding: 16px; border-radius: 20px; text-align: left; display: flex; flex-direction: column; justify-content: flex-end; gap: 3px;
    background: var(--glass) center / cover no-repeat; border: 2px solid transparent; color: #fff; }
  .dest::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.72)); }
  .dest > * { position: relative; }
  .dest.on { border-color: var(--l1, #ff4f7b); box-shadow: 0 0 0 4px color-mix(in srgb, var(--l1, #ff4f7b) 25%, transparent); }
  .dest b { font: 700 20px/1.15 Georgia, "Times New Roman", serif; }
  .dest small { opacity: .85; font-size: 12.5px; }
  .dest .px { position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: 10px; font-size: 12.5px; font-weight: 700; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .dest .px.over { background: rgba(255,90,110,.75); }
  .dest-row { display: flex; gap: 12px; align-items: stretch; margin-bottom: 18px; }
  .dest-row .dests { flex: 1; margin-bottom: 0; }
  .add-dest { flex: 0 0 76px; min-height: 150px; border-radius: 20px; display: grid; place-items: center; color: var(--fg); cursor: pointer;
    background: linear-gradient(180deg, var(--glass), var(--glass2, var(--glass))); border: 1.5px dashed color-mix(in srgb, var(--fg) 28%, transparent);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); transition: border-color .2s, transform .2s, flex-basis .25s; }
  .add-dest:hover { border-color: var(--l1, #ff4f7b); transform: translateY(-2px); }
  .add-dest svg { width: 30px; height: 30px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  .add-dest.busy { cursor: default; border-style: solid; }
  .add-dest.busy svg { animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .add-form { flex: 0 0 280px; min-height: 150px; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 8px; justify-content: center;
    background: linear-gradient(180deg, var(--glass), var(--glass2, var(--glass))); border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  .add-form b { font-size: 13.5px; }
  .add-form input { height: 38px; border-radius: 12px; padding: 0 12px; background: rgba(0,0,0,.18); border: 1px solid var(--glass-border); color: inherit; font: inherit; font-size: 13.5px; outline: none; }
  .add-form .row { display: flex; gap: 8px; }
  .add-form .row button { flex: 1; height: 34px; border-radius: 11px; font-size: 13px; font-weight: 600; }
  .add-form .row .ok { background: var(--l1, #ff4f7b); color: #fff; }
  .add-form .row .no { background: rgba(255,255,255,.08); color: inherit; }
  .add-err { font-size: 12px; color: #ff8a9a; }
  @media (max-width: 720px) { .dest-row { flex-direction: column; } .add-dest { min-height: 64px; flex-basis: auto; } }

  .hero { position: relative; overflow: hidden; border-radius: 26px; min-height: 260px; padding: 26px; display: flex; flex-direction: column; justify-content: flex-end;
    background: var(--glass) center / cover no-repeat; color: #fff; }
  .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.0) 20%, rgba(0,0,0,.75)); }
  .hero > * { position: relative; }
  .hero .k { font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; opacity: .9; }
  .hero h2 { font: 700 40px/1.05 Georgia, "Times New Roman", serif; letter-spacing: -.5px; margin-top: 4px; }
  .hero p { max-width: 720px; margin-top: 8px; font-size: 15px; opacity: .92; }
  .hero .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .hero .tags span { font-size: 12px; padding: 4px 10px; border-radius: 10px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .hero .acts { position: absolute; top: 16px; right: 16px; display: flex; gap: 6px; }
  .hero .acts button, .hero .acts a { height: 34px; padding: 0 12px; border-radius: 17px; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.25); color: #fff; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .hero .acts svg { width: 15px; height: 15px; }

  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; margin-top: 18px; align-items: start; }
  .side { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 18px; }
  section.card { padding: 20px 22px; }
  section.card + section.card { margin-top: 18px; }
  .card h3 { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 650; margin-bottom: 14px; }
  .card h3 svg { width: 20px; height: 20px; color: var(--l1, #ff4f7b); }
  .card h3 small { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--fg-dim); }

  .opt { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 14px; }
  .opt + .opt { margin-top: 10px; }
  .opt .mi { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--l1, #ff4f7b) 16%, transparent); color: var(--l1, #ff4f7b); }
  .opt .mi svg { width: 24px; height: 24px; }
  .opt .tt { font-weight: 650; font-size: 15px; }
  .opt .mt { font-size: 13px; color: var(--fg-dim); margin-top: 2px; }
  .opt .ds { font-size: 13.5px; margin-top: 6px; line-height: 1.45; }
  .opt .pr { text-align: right; white-space: nowrap; }
  .opt .pr b { font-size: 18px; } .opt .pr small { display: block; font-size: 11.5px; color: var(--fg-dim); }
  .links { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .links a, .links button { height: 30px; padding: 0 12px; border-radius: 15px; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
    background: var(--glass); border: 1px solid var(--glass-border); }
  .links a:hover, .links button:hover { background: var(--hover); }
  .links .agent { border-color: color-mix(in srgb, var(--l1, #ff4f7b) 60%, transparent); background: color-mix(in srgb, var(--l1, #ff4f7b) 16%, transparent); }
  .links svg { width: 14px; height: 14px; }

  .days { position: relative; padding-left: 26px; }
  .days::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--l1, #ff4f7b), var(--l3, #c86bff)); opacity: .5; border-radius: 2px; }
  .day { position: relative; padding-bottom: 16px; }
  .day::before { content: attr(data-n); position: absolute; left: -26px; top: 0; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700;
    background: var(--l1, #ff4f7b); color: #fff; }
  .day b { font-size: 14.5px; } .day small { color: var(--fg-dim); font-size: 12.5px; margin-left: 6px; }
  .day ul { list-style: none; margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  .day li { font-size: 13.5px; padding-left: 14px; position: relative; }
  .day li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 2px; background: var(--fg-dim); }
  .day li a { text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--fg) 30%, transparent); text-underline-offset: 2px; }
  .sk { height: 12px; border-radius: 6px; background: var(--hover); margin: 10px 0; animation: skp 1.1s ease-in-out infinite alternate; }
  @keyframes skp { to { opacity: .4; } }

  /* budget */
  .bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--hover); }
  .bar i { display: block; height: 100%; }
  .leg { display: grid; grid-template-columns: 12px 1fr auto; gap: 6px 9px; align-items: center; margin-top: 12px; font-size: 13px; }
  .leg i { width: 12px; height: 12px; border-radius: 4px; }
  .leg b { font-weight: 600; }
  .tot { display: flex; align-items: baseline; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hover); }
  .tot b { font-size: 24px; } .tot small { font-size: 12.5px; color: var(--fg-dim); }
  .tot .ok { color: #3ddc97; } .tot .ko { color: #ff8a9a; }

  /* météo */
  .wx { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .wd { flex: none; width: 64px; padding: 9px 4px; border-radius: 14px; text-align: center; background: var(--glass); border: 1px solid var(--hover); font-size: 12px; }
  .wd .e { font-size: 22px; line-height: 1.2; } .wd b { display: block; font-size: 13px; } .wd small { color: var(--fg-dim); }
  .wnote { font-size: 12px; color: var(--fg-dim); margin-top: 8px; }
  .tips { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .tips li { font-size: 13.5px; padding-left: 22px; position: relative; line-height: 1.45; }
  .tips li::before { content: "✦"; position: absolute; left: 0; color: var(--l1, #ff4f7b); }

  /* ajustements */
  .refine { display: flex; gap: 8px; margin-top: 18px; padding: 8px; border-radius: 22px; }
  .refine input { flex: 1; min-width: 0; height: 40px; padding: 0 14px; background: none; border: 0; outline: 0; font-size: 14.5px; }
  .refine .chips { align-items: center; }

  /* mes voyages */
  #saved { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 92vw); z-index: 10; padding: 22px; transform: translateX(105%); transition: transform .3s ease; border-radius: 24px 0 0 24px; overflow-y: auto; }
  #saved.open { transform: none; }
  #saved h3 { display: flex; align-items: center; margin-bottom: 14px; font-size: 17px; }
  #saved h3 button { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
  #saved h3 button:hover { background: var(--hover); }
  #saved h3 svg { width: 17px; height: 17px; }
  .sv { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 10px; border-radius: 16px; background: var(--glass); border: 1px solid var(--hover); }
  .sv + .sv { margin-top: 8px; }
  .sv:hover { background: var(--hover); }
  .sv .th { width: 54px; height: 54px; border-radius: 12px; background: var(--hover) center / cover; flex: none; }
  .sv b { display: block; font-size: 14px; } .sv small { color: var(--fg-dim); font-size: 12px; }
  .sv .x { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--fg-dim); flex: none; }
  .sv .x:hover { background: var(--hover); color: var(--fg); }
  .sv .x svg { width: 14px; height: 14px; }

  @media (max-width: 980px) { .cols { grid-template-columns: 1fr; } .side { position: static; } }
</style>
</head>
<body>
  <div id="ambient" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <main>
    <div class="top">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M10.5 21l1.5-6.5-4-2.5-3 1-1-1 3.5-3L6 4.5l1.5-1 5 4 4.5-4a2 2 0 0 1 3 3l-4.5 4.5 4 5-1 1.5-4.5-1.5-3 3.5z"/></svg></div>
      <div><h1>Agent voyage</h1><p>Vols, trains, bateaux, hôtels, Airbnb : l’IA prépare tout, selon votre budget.</p></div>
      <div class="sp"></div>
      <button class="pill" id="saved-btn"><svg viewBox="0 0 24 24"><path d="M6.5 4h11v16l-5.5-3.5L6.5 20z"/></svg>Mes voyages</button>
    </div>

    <form id="form" class="glass" autocomplete="off">
      <textarea id="wish" rows="1" spellcheck="false" placeholder="Décrivez votre voyage : « une semaine au soleil en mars, plage et bonne cuisine »…"></textarea>
      <div class="ex" id="examples"></div>
      <div class="grid">
        <div class="f"><label for="from">Départ</label><input id="from" placeholder="Paris"></div>
        <div class="f"><label for="to">Destination</label><input id="to" placeholder="Ville, pays… ou vide : surprenez-moi"></div>
        <div class="f"><label>Dates</label><div class="row2"><input id="d1" type="date"><input id="d2" type="date"></div></div>
        <div class="f"><label for="flex">Ou période</label><input id="flex" placeholder="ex. un week-end en avril"></div>
        <div class="f"><label>Voyageurs</label><div class="row2"><select id="adults"></select><select id="kids"></select></div></div>
      </div>
      <div class="opts">
        <div class="f"><label>Budget total</label>
          <div class="budget"><input id="budget" type="range" min="100" max="10000" step="50" value="1200"><output id="budget-v">1 200 €</output></div></div>
        <div class="f"><label>Transports</label><div class="chips" id="modes"></div></div>
        <div class="f"><label>Hébergement</label><div class="chips" id="stays"></div></div>
        <div class="f"><label>Style de voyage</label><div class="chips" id="styles"></div></div>
      </div>
      <div class="go">
        <span class="note">L’IA connectée à Corrtex prépare le voyage en coulisse. Les prix sont des estimations : les liens ouvrent les sites avec votre recherche déjà remplie.</span>
        <button class="btn" id="go"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Préparer mon voyage</button>
      </div>
    </form>

    <div id="progress" class="glass"><ul class="steps" id="steps"></ul><div class="err-box" id="err" hidden></div></div>
    <div id="result"></div>
  </main>

  <aside id="saved" class="glass"><h3>Mes voyages<button id="saved-x" title="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3><div id="saved-list"></div></aside>

  <script>
  (function () {
    const C = window.Corrtex;
    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const enc = encodeURIComponent;
    const eur = (n) => n == null || isNaN(n) ? '?' : Math.round(n).toLocaleString('fr-FR') + ' €';
    const invoke = (c, a) => window.__TAURI__.core.invoke(c, a);

    // ------------------------------------------------------------ thème et fond (comme l'accueil)
    function theme() {
      C.applyTheme();
      const p = C.prefs();
      const hex = /^#[0-9a-f]{6}$/i.test(p.light) ? p.light : '#ff4f7b';
      const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
      const s = d ? (l > .5 ? d / (2 - mx - mn) : d / (mx + mn)) : 0;
      const h = !d ? 0 : mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      const hsl = (hh, ss, ll) => 'hsl(' + ((hh % 360) + 360) % 360 + ' ' + Math.round(ss * 100) + '% ' + Math.round(ll * 100) + '%)';
      const st = document.documentElement.style;
      st.setProperty('--l1', hsl(h * 60, s, l));
      st.setProperty('--l2', hsl(h * 60 + 38, s, Math.min(.7, l + .05)));
      st.setProperty('--l3', hsl(h * 60 - 42, s * .9, Math.max(.35, l - .05)));
      st.setProperty('--intensity', p.lightIntensity);
      document.documentElement.classList.toggle('light-off', !p.lightOn);
    }
    theme();
    window.addEventListener('storage', (e) => { if (e.key === 'corrtex.prefs') theme(); });
    document.addEventListener('visibilitychange', () => document.documentElement.classList.toggle('paused', document.hidden));

    // ------------------------------------------------------------ formulaire
    const I = {
      plane: '<path d="M10.5 21l1.5-6.5-4-2.5-3 1-1-1 3.5-3L6 4.5l1.5-1 5 4 4.5-4a2 2 0 0 1 3 3l-4.5 4.5 4 5-1 1.5-4.5-1.5-3 3.5z"/>',
      train: '<rect x="5.5" y="3.5" width="13" height="14" rx="3"/><path d="M5.5 11h13M9 21l1.5-3.5M15 21l-1.5-3.5"/><circle cx="9" cy="14.3" r=".8"/><circle cx="15" cy="14.3" r=".8"/>',
      boat: '<path d="M3 17c1.5 1.5 3 1.5 4.5 0s3-1.5 4.5 0 3 1.5 4.5 0 3-1.5 4.5 0"/><path d="M5 14l1.5-5h11L19 14M9 9V5.5h6V9"/>',
      bus: '<rect x="4.5" y="3.5" width="15" height="14" rx="3"/><path d="M4.5 11h15M7.5 20.5v-3M16.5 20.5v-3"/><circle cx="8" cy="14.3" r=".8"/><circle cx="16" cy="14.3" r=".8"/>',
      car: '<path d="M5 16.5V12l2-5h10l2 5v4.5M3.5 12h17"/><circle cx="7.5" cy="16.5" r="1.8"/><circle cx="16.5" cy="16.5" r="1.8"/>',
      hotel: '<path d="M3.5 20.5V6.5M3.5 15.5h17v5M20.5 15.5v-3a3 3 0 0 0-3-3h-7v6"/><circle cx="7" cy="11.5" r="2"/>',
      home: '<path d="M4 11l8-6.5 8 6.5M6 9.5v10h12v-10M10 19.5v-5h4v5"/>',
      hostel: '<path d="M4 20V5M20 20v-8a3 3 0 0 0-3-3H8M4 13h16M4 17h16"/>',
      tent: '<path d="M3 20h18L12 4zM12 4v16M9.5 20l2.5-5 2.5 5"/>',
      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
      cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
      wallet: '<path d="M4 7.5h14.5a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5.5A1.5 1.5 0 0 1 4 19V6a2 2 0 0 1 2-2h11"/><circle cx="16.5" cy="14" r="1.2"/>',
      bulb: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
      ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 19V7.5A1.5 1.5 0 0 1 5.5 6H10"/>',
      bot: '<path d="M5 4.5l5.5 14 2-5.8 5.8-2z"/><path d="M13 13l5.5 5.5"/>',
      map: '<path d="M9 4.5l-5 2v13l5-2 6 2 5-2v-13l-5 2z"/><path d="M9 4.5v13M15 6.5v13"/>',
      save: '<path d="M6.5 4h11v16l-5.5-3.5L6.5 20z"/>',
      pop: '<rect x="3.5" y="7.5" width="13" height="13" rx="2.5"/><path d="M11 3.5h9.5V13M20.5 3.5l-9 9"/>',
    };
    const svg = (k) => '<svg viewBox="0 0 24 24">' + I[k] + '</svg>';
    const MODES = [['avion', 'Avion', 'plane'], ['train', 'Train', 'train'], ['bateau', 'Bateau', 'boat'], ['bus', 'Bus / covoiturage', 'bus'], ['voiture', 'Voiture', 'car']];
    const STAYS = [['hôtel', 'Hôtel', 'hotel'], ['airbnb', 'Airbnb', 'home'], ['auberge', 'Auberge', 'hostel'], ['camping', 'Camping', 'tent']];
    const STYLES = [['détente', 'Détente'], ['culture', 'Culture'], ['aventure', 'Aventure'], ['nature', 'Nature'], ['gastronomie', 'Gastronomie'], ['fête', 'Fête'], ['romantique', 'Romantique'], ['famille', 'En famille']];
    function chips(box, list, on) {
      const el = $(box);
      list.forEach(([id, label, icon]) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.id = id;
        b.innerHTML = (icon ? svg(icon) : '') + esc(label);
        if (on.indexOf(id) >= 0) b.classList.add('on');
        b.onclick = () => b.classList.toggle('on');
        el.appendChild(b);
      });
    }
    chips('modes', MODES, ['avion', 'train']);
    chips('stays', STAYS, ['hôtel', 'airbnb']);
    chips('styles', STYLES, []);
    const picked = (box) => [...$(box).querySelectorAll('button.on')].map((b) => b.dataset.id);
    for (let i = 1; i <= 9; i++) $('adults').insertAdjacentHTML('beforeend', '<option value="' + i + '"' + (i === 2 ? ' selected' : '') + '>' + i + ' adulte' + (i > 1 ? 's' : '') + '</option>');
    for (let i = 0; i <= 6; i++) $('kids').insertAdjacentHTML('beforeend', '<option value="' + i + '">' + (i ? i + ' enfant' + (i > 1 ? 's' : '') : 'sans enfant') + '</option>');
    const bud = $('budget');
    const showBud = () => { $('budget-v').textContent = (+bud.value >= 10000 ? '10 000 € +' : eur(+bud.value)); };
    bud.addEventListener('input', showBud);
    showBud();
    const wish = $('wish');
    const grow = () => { wish.style.height = 'auto'; wish.style.height = Math.min(160, wish.scrollHeight) + 'px'; };
    wish.addEventListener('input', grow);
    wish.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); } });
    const EX = ['Un week-end romantique en Italie, en train', 'Une semaine au soleil en février, plage et snorkeling', 'Road trip nature en Écosse pour 4', 'Les îles grecques en ferry cet été', 'Surprends-moi : 3 jours, 500 € tout compris'];
    EX.forEach((t) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.onclick = () => { wish.value = t; grow(); wish.focus(); }; $('examples').appendChild(b); });
    $('from').value = C.load('travelFrom', '') || '';

    // ------------------------------------------------------------ IA en coulisse (deux sessions)
    const aiWait = {};
    window.__corrtexShopAI = (req, text, done, error) => {
      const w = aiWait[req];
      if (!w) return;
      if (text) w.text = text;
      if (w.onText && text) w.onText(text);
      if (done || error) {
        clearTimeout(w.timer);
        delete aiWait[req];
        if (w.text) w.resolve(w.text); else w.reject('pas de réponse de l’IA');
      }
    };
    function ask(prompt, slot, ms, onText) {
      return new Promise((resolve, reject) => {
        const req = 'tv' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        aiWait[req] = { resolve, reject, text: '', onText, timer: setTimeout(() => { delete aiWait[req]; reject('délai dépassé'); }, ms || 120000) };
        invoke('shop_ask_ai', { prompt, req, slot }).catch((e) => { delete aiWait[req]; reject(String(e)); });
      });
    }
    function json(t) {
      t = String(t || '').replace(/```(?:json)?/g, '');
      const i = t.indexOf('{'), j = t.lastIndexOf('}');
      if (i < 0 || j < i) return null;
      try { return JSON.parse(t.slice(i, j + 1)); } catch (e) {
        try { return JSON.parse(t.slice(i, j + 1).replace(/,\s*([}\]])/g, '$1')); } catch (e2) { return null; }
      }
    }
    invoke('shop_ai_warm', { slots: [3, 2] }).catch(() => {});

    // ------------------------------------------------------------ progression
    let steps = [];
    function step(t, s) { steps.push({ t, s: s || 'run' }); drawSteps(); return steps.length - 1; }
    function setStep(i, s, t) { if (steps[i]) { steps[i].s = s; if (t) steps[i].t = t; drawSteps(); } }
    function drawSteps() { $('steps').innerHTML = steps.map((x) => '<li class="' + x.s + '">' + esc(x.t) + '</li>').join(''); }

    // ------------------------------------------------------------ état du voyage
    let trip = null, sel = 0, running = false;
    const today = new Date().toISOString().slice(0, 10);
    $('d1').min = today; $('d2').min = today;
    $('d1').addEventListener('change', () => { $('d2').min = $('d1').value || today; if ($('d2').value && $('d2').value < $('d1').value) $('d2').value = ''; });

    function input() {
      return {
        wish: wish.value.trim(), from: $('from').value.trim(), to: $('to').value.trim(), d1: $('d1').value, d2: $('d2').value, flex: $('flex').value.trim(),
        adults: +$('adults').value, kids: +$('kids').value, budget: +bud.value, modes: picked('modes'), stays: picked('stays'), styles: picked('styles'), refine: [],
      };
    }
    function planPrompt(q, one) {
      const who = q.adults + ' adulte(s)' + (q.kids ? ' et ' + q.kids + ' enfant(s)' : '');
      const dates = q.d1 ? 'du ' + q.d1 + (q.d2 ? ' au ' + q.d2 : '') : (q.flex || 'dates libres : propose les meilleures');
      return 'Tu es un agent de voyage expert. Prépare un voyage.\n' +
        'Envie : ' + (q.wish || '(non précisée)') + '\n' +
        'Départ : ' + (q.from || 'Paris') + '\nDestination : ' + (q.to || 'à proposer (3 idées variées)') + '\n' +
        'Dates : ' + dates + ' (nous sommes le ' + today + ')\nVoyageurs : ' + who + '\nBudget total maximum : ' + (q.budget >= 10000 ? 'sans limite' : q.budget + ' € pour tout le groupe') + '\n' +
        'Transports acceptés : ' + (q.modes.join(', ') || 'tous') + '\nHébergements souhaités : ' + (q.stays.join(', ') || 'tous') + '\n' +
        'Style : ' + (q.styles.join(', ') || 'libre') + '\n' + (q.refine.length ? 'Ajustements demandés : ' + q.refine.join(' ; ') + '\n' : '') +
        '\nRéponds UNIQUEMENT par un objet JSON valide, sans texte autour, de cette forme :\n' +
        '{"summary":"2 phrases","dates":{"start":"AAAA-MM-JJ","end":"AAAA-MM-JJ"},' +
        '"destinations":[{"name":"Ville","country":"Pays","region":"région ou zone","why":"pourquoi c’est idéal, 2 phrases","tags":["3 mots-clés"],' +
        '"transport":[{"mode":"avion|train|bateau|bus|voiture","from":"ville de départ","to":"ville d’arrivée","from_iata":"code IATA ville ou vide","to_iata":"code IATA ville ou vide","duration":"ex. 2 h 30","price_min":60,"price_max":150,"per":"personne aller-retour","details":"compagnies, gares, ports, conseils"}],' +
        '"lodging":[{"type":"hôtel|airbnb|auberge|camping","area":"quartier","price_night_min":70,"price_night_max":120,"why":"pour qui et pourquoi"}],' +
        '"budget":{"transport":0,"lodging":0,"food":0,"activities":0,"local":0,"total":0},"tips":["3 à 5 conseils pratiques (saison, formalités, monnaie, réservation)"]}]}\n' +
        'Règles : ' + (one ? 'exactement UNE destination' + (q.to ? ' (celle demandée)' : ', nouvelle') : q.to ? 'une seule destination (celle demandée)' : 'exactement 3 destinations différentes') + ' ; 2 ou 3 options de transport réalistes par destination parmi les transports acceptés, la plus intéressante en premier ; 2 options d’hébergement parmi les types souhaités ; ' +
        'prix réalistes en euros pour la période, budget = total pour tout le groupe ; respecte le budget si possible ; codes IATA de ville (PAR, LON…) quand un vol est pertinent ; « dates » = dates précises conseillées.';
    }
    function dayPrompt(q, d, dates) {
      return 'Programme jour par jour d’un voyage à ' + d.name + ' (' + d.country + ') du ' + dates.start + ' au ' + dates.end + ', pour ' + q.adults + ' adulte(s)' + (q.kids ? ' et ' + q.kids + ' enfant(s)' : '') +
        ', style : ' + (q.styles.join(', ') || 'équilibré') + (q.wish ? ', envie : ' + q.wish : '') + '. Hébergement vers : ' + ((d.lodging || [])[0] || {}).area + '.\n' +
        'Réponds UNIQUEMENT par un objet JSON valide : {"days":[{"day":1,"title":"titre court","area":"quartier ou lieu","items":["matin : …","midi : … (adresse ou spécialité)","après-midi : …","soir : …"]}]}\n' +
        'Un élément par jour du voyage (14 jours au plus), activités concrètes et réalistes, lieux précis, spécialités locales à goûter.';
    }

    // ------------------------------------------------------------ lancement
    $('form').addEventListener('submit', (e) => { e.preventDefault(); run(input()); });
    async function run(q) {
      if (running) return;
      if (!q.wish && !q.to) { wish.focus(); wish.placeholder = 'Dites au moins où ou comment vous voulez voyager…'; return; }
      running = true;
      $('go').disabled = true;
      if (q.from) C.save('travelFrom', q.from);
      steps = [];
      $('err').hidden = true;
      $('progress').classList.add('on');
      $('result').classList.remove('on');
      $('progress').scrollIntoView({ behavior: 'smooth', block: 'center' });
      const s1 = step('L’agent analyse votre demande et compare les destinations…');
      try {
        const t = await ask(planPrompt(q), 3, 150000, (txt) => { setStep(s1, 'run', 'L’agent rédige les options (' + Math.min(99, Math.round(txt.length / 40)) + ' %)…'); });
        const r = json(t);
        if (!r || !Array.isArray(r.destinations) || !r.destinations.length) throw 'réponse de l’IA illisible';
        setStep(s1, 'ok', r.destinations.length > 1 ? r.destinations.length + ' destinations proposées' : 'Voyage à ' + r.destinations[0].name + ' préparé');
        trip = { id: Date.now(), q, r, days: {}, img: {}, wx: {}, saved: false };
        adding = null;
        sel = 0;
        render();
        enrich(0);
      } catch (e) {
        setStep(s1, 'err', 'Échec : ' + e);
        $('err').hidden = false;
        $('err').innerHTML = '<button class="pill" id="retry">Réessayer</button><span style="font-size:13px;color:var(--fg-dim)">Si l’IA ne répond pas, vérifiez dans le panneau IA que vous êtes connecté à Claude, ChatGPT ou Gemini.</span>';
        $('retry').onclick = () => run(q);
      }
      running = false;
      $('go').disabled = false;
    }
    // photo, météo et programme de la destination choisie (en parallèle)
    function enrich(i) {
      const d = trip.r.destinations[i];
      if (!d) return;
      const t0 = trip;
      if (!t0.img[i]) photo(d).then((u) => { if (u && trip === t0) { t0.img[i] = u; render(); } });
      if (!t0.wx[i]) weather(d, t0).then((w) => { if (w && trip === t0) { t0.wx[i] = w; render(); } });
      if (!t0.days[i]) {
        t0.days[i] = { loading: true };
        const dates = t0.r.dates && t0.r.dates.start ? t0.r.dates : { start: t0.q.d1 || today, end: t0.q.d2 || t0.q.d1 || today };
        ask(dayPrompt(t0.q, d, dates), 2, 150000).then((txt) => {
          const j = json(txt);
          t0.days[i] = j && Array.isArray(j.days) ? { list: j.days } : { error: true };
        }).catch(() => { t0.days[i] = { error: true }; }).finally(() => { if (trip === t0) render(); });
      }
      // les photos des autres idées, pour les cartes
      trip.r.destinations.forEach((x, k) => { if (k !== i && !t0.img[k]) photo(x).then((u) => { if (u && trip === t0) { t0.img[k] = u; render(); } }); });
    }
    // photo de la ville elle-même (vue, rues, monuments), jamais une carte, un drapeau ou un blason
    const NOT_PHOTO = /\b(map|carte|plan|locator|location|flag|drapeau|blason|coat[ _-]?of[ _-]?arms|arms|escudo|wappen|logo|icon|vector|svg|clipart|illustration|drawing|dessin|infographi|diagram|schema|outline|silhouette|seal|emblem|armoiries)\b|\.svg|\.gif/i;
    function goodPhoto(x, minW) {
      const u = x.image || '';
      if (!/^https:/.test(u) || NOT_PHOTO.test(u) || NOT_PHOTO.test(x.title || '')) return false;
      const w = +x.width || 0, h = +x.height || 0;
      return w >= minW && (!h || w >= h * 1.15);
    }
    async function images(q) {
      try { return JSON.parse(await invoke('search_fetch', { source: 'images', q, page: 1, form: null })).results || []; } catch (e) { return []; }
    }
    async function photo(d) {
      const place = d.name + (d.country ? ' ' + d.country : '');
      const [a, b] = await Promise.all([images(place + ' ville vue panorama'), images(d.name + ' skyline city view')]);
      const pick = a.find((x) => goodPhoto(x, 1100)) || b.find((x) => goodPhoto(x, 1100)) || a.concat(b).find((x) => goodPhoto(x, 700));
      if (pick) return pick.image;
      // dernier recours : la photo de l'article Wikipédia, si ce n'est ni une carte ni un drapeau
      try {
        const j = JSON.parse(await invoke('search_fetch', { source: 'wiki', q: place, page: 1, form: null }));
        const p = ((j.query || {}).pages || [])[0], u = p && p.thumbnail && p.thumbnail.source;
        if (u && /^https:/.test(u) && !NOT_PHOTO.test(u) && !/\.svg/i.test(u) && (p.thumbnail.width || 0) >= (p.thumbnail.height || 0)) return u.replace(/\/(\d+)px-/, '/1280px-');
      } catch (e) {}
      return '';
    }
    async function weather(d, t) {
      try {
        const g = (JSON.parse(await invoke('search_fetch', { source: 'geo', q: d.name, page: 1, form: null })).results || [])[0];
        if (!g) return null;
        const dates = t.r.dates && t.r.dates.start ? t.r.dates : { start: t.q.d1, end: t.q.d2 || t.q.d1 };
        if (!dates.start) return null;
        let s = dates.start, e = dates.end || dates.start;
        if (e < s) e = s;
        const span = Math.min(14, Math.round((new Date(e) - new Date(s)) / 864e5));
        e = new Date(new Date(s).getTime() + span * 864e5).toISOString().slice(0, 10);
        const ahead = (new Date(s) - new Date(today)) / 864e5;
        // dans les 15 jours : prévisions ; plus tard : relevés de l'an dernier aux mêmes dates
        const mode = ahead >= 0 && ahead + span <= 15 ? 'f' : 'a';
        const shift = (x) => { const y = new Date(x); y.setFullYear(y.getFullYear() - 1); return y.toISOString().slice(0, 10); };
        const [a, b] = mode === 'f' ? [s, e] : [shift(s), shift(e)];
        const w = JSON.parse(await invoke('search_fetch', { source: 'weather', q: [mode, g.latitude.toFixed(3), g.longitude.toFixed(3), a, b].join('|'), page: 1, form: null }));
        if (!w.daily || !w.daily.time) return null;
        return { mode, place: g.name + (g.country ? ', ' + g.country : ''), lat: g.latitude, lon: g.longitude, days: w.daily.time.map((x, k) => ({ date: mode === 'f' ? x : new Date(new Date(x).setFullYear(new Date(x).getFullYear() + 1)).toISOString().slice(0, 10),
          code: w.daily.weather_code[k], max: w.daily.temperature_2m_max[k], min: w.daily.temperature_2m_min[k], rain: w.daily.precipitation_sum[k] })) };
      } catch (e) { return null; }
    }
    const WX = (c) => c === 0 ? '☀️' : c <= 2 ? '🌤️' : c === 3 ? '☁️' : c <= 48 ? '🌫️' : c <= 57 ? '🌦️' : c <= 67 ? '🌧️' : c <= 77 ? '🌨️' : c <= 82 ? '🌧️' : c <= 86 ? '🌨️' : '⛈️';

    // ------------------------------------------------------------ liens déjà remplis
    function nights(t) { const a = t.dates.start, b = t.dates.end; return a && b ? Math.max(1, Math.round((new Date(b) - new Date(a)) / 864e5)) : 0; }
    function tripDates() { const r = trip.r.dates || {}; return { start: r.start || trip.q.d1 || '', end: r.end || trip.q.d2 || '' }; }
    const ymd = (d) => d ? d.slice(2).replace(/-/g, '') : '';
    function transportLinks(o) {
      const dt = tripDates(), q = trip.q, pax = q.adults + q.kids, L = [];
      const fr = o.from || q.from || 'Paris', to = o.to || '';
      if (o.mode === 'avion') {
        L.push(['Google Flights', 'https://www.google.com/travel/flights?hl=fr&q=' + enc('Vols de ' + fr + ' à ' + to + (dt.start ? ' le ' + dt.start : '') + (dt.end ? ' retour le ' + dt.end : '') + ' ' + pax + ' passagers')]);
        if (o.from_iata && o.to_iata && dt.start) {
          L.push(['Skyscanner', 'https://www.skyscanner.fr/transport/vols/' + o.from_iata.toLowerCase() + '/' + o.to_iata.toLowerCase() + '/' + ymd(dt.start) + '/' + (dt.end ? ymd(dt.end) + '/' : '') + '?adultsv2=' + q.adults + (q.kids ? '&childrenv2=' + Array(q.kids).fill(8).join('|') : '')]);
          L.push(['Kayak', 'https://www.kayak.fr/flights/' + o.from_iata.toUpperCase() + '-' + o.to_iata.toUpperCase() + '/' + dt.start + (dt.end ? '/' + dt.end : '') + '/' + q.adults + 'adults' + (q.kids ? '/children-' + Array(q.kids).fill(8).join('-') : '')]);
        }
      } else if (o.mode === 'train') {
        L.push(['Trainline', 'https://www.thetrainline.com/fr/horaires-train/' + slug(fr) + '-a-' + slug(to)]);
        L.push(['SNCF Connect', 'https://www.sncf-connect.com/']);
        L.push(['Rechercher', C.searchUrl('train ' + fr + ' ' + to + (dt.start ? ' ' + dt.start : ''), 'corrtex')]);
      } else if (o.mode === 'bateau') {
        L.push(['Ferryhopper', 'https://www.ferryhopper.com/fr/']);
        L.push(['Direct Ferries', 'https://www.directferries.fr/']);
        L.push(['Rechercher', C.searchUrl('ferry ' + fr + ' ' + to + (dt.start ? ' ' + dt.start : ''), 'corrtex')]);
      } else if (o.mode === 'bus') {
        L.push(['BlaBlaCar', 'https://www.blablacar.fr/search?fn=' + enc(fr) + '&tn=' + enc(to) + (dt.start ? '&db=' + dt.start : '') + '&seats=' + Math.min(pax, 4)]);
        L.push(['FlixBus', 'https://www.flixbus.fr/']);
      } else if (o.mode === 'voiture') {
        L.push(['Itinéraire', 'https://www.google.com/maps/dir/?api=1&origin=' + enc(fr) + '&destination=' + enc(to) + '&travelmode=driving']);
        L.push(['Location', 'https://www.kayak.fr/cars/' + enc(to) + (dt.start ? '/' + dt.start + (dt.end ? '/' + dt.end : '') : '')]);
      }
      return L;
    }
    function slug(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
    function lodgingLinks(o, d) {
      const dt = tripDates(), q = trip.q, place = (o.area ? o.area + ', ' : '') + d.name, L = [];
      const maxN = o.price_night_max ? Math.round(o.price_night_max * 1.15) : '';
      if (o.type === 'airbnb') L.push(['Airbnb', 'https://www.airbnb.fr/s/' + enc(place.replace(/,\s*/g, '--')) + '/homes?adults=' + q.adults + (q.kids ? '&children=' + q.kids : '') + (dt.start ? '&checkin=' + dt.start : '') + (dt.end ? '&checkout=' + dt.end : '') + (maxN ? '&price_max=' + maxN : '')]);
      if (o.type === 'auberge') L.push(['Hostelworld', 'https://www.hostelworld.com/find?search_keywords=' + enc(d.name) + (dt.start ? '&date_from=' + dt.start : '') + (dt.end ? '&date_to=' + dt.end : '') + '&number_of_guests=' + (q.adults + q.kids)]);
      if (o.type === 'camping') L.push(['Camping', C.searchUrl('camping ' + place, 'corrtex')]);
      L.push(['Booking', 'https://www.booking.com/searchresults.fr.html?ss=' + enc(place) + (dt.start ? '&checkin=' + dt.start : '') + (dt.end ? '&checkout=' + dt.end : '') + '&group_adults=' + q.adults + '&group_children=' + q.kids + '&no_rooms=1']);
      L.push(['Google Hôtels', 'https://www.google.com/travel/search?hl=fr&q=' + enc((o.type === 'airbnb' ? 'locations ' : 'hôtels ') + place)]);
      L.push(['Carte', 'https://www.google.com/maps/search/?api=1&query=' + enc(place)]);
      return L;
    }
    const linkHtml = (L) => L.map(([n, u]) => '<a href="' + esc(u) + '">' + svg('ext') + esc(n) + '</a>').join('');

    // ------------------------------------------------------------ affichage
    const MODE_IC = { avion: 'plane', train: 'train', bateau: 'boat', bus: 'bus', voiture: 'car' };
    const STAY_IC = { hôtel: 'hotel', hotel: 'hotel', airbnb: 'home', auberge: 'hostel', camping: 'tent' };
    const COLORS = ['var(--l1, #ff4f7b)', 'var(--l2, #ff8a3d)', 'var(--l3, #c86bff)', '#3ddc97', '#2fb7ff'];
    function render() {
      if (!trip) return;
      const r = trip.r, d = r.destinations[sel], q = trip.q, dt = tripDates(), n = nights({ dates: dt });
      const total = (x) => x.budget && x.budget.total ? x.budget.total : 0;
      let h = '';
      if (r.summary) h += '<p class="summary">' + esc(r.summary) + '</p>';
      {
        h += '<div class="dest-row"><div class="dests">' + r.destinations.map((x, i) => '<button class="dest' + (i === sel ? ' on' : '') + '" data-dest="' + i + '"' + (trip.img[i] ? ' style="background-image:url(\'' + esc(trip.img[i]) + '\')"' : '') + '>' +
          (total(x) ? '<span class="px' + (q.budget < 10000 && total(x) > q.budget ? ' over' : '') + '">' + eur(total(x)) + '</span>' : '') +
          '<b>' + esc(x.name) + '</b><small>' + esc([x.region, x.country].filter(Boolean).join(', ')) + '</small></button>').join('') + '</div>' + addBox() + '</div>';
      }
      const when = dt.start ? new Date(dt.start).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' }) + (dt.end ? ' → ' + new Date(dt.end).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : '') : '';
      h += '<div class="hero glass"' + (trip.img[sel] ? ' style="background-image:url(\'' + esc(trip.img[sel]) + '\')"' : '') + '>' +
        '<div class="acts"><button data-act="save">' + svg('save') + (trip.saved ? 'Enregistré' : 'Enregistrer') + '</button><button data-act="pop">' + svg('pop') + 'Détacher</button>' +
        '<a href="https://www.google.com/maps/search/?api=1&query=' + enc(d.name + ', ' + d.country) + '">' + svg('map') + 'Carte</a></div>' +
        '<div class="k">' + esc([d.country, when, n ? n + ' nuit' + (n > 1 ? 's' : '') : '', q.adults + q.kids + ' voyageur' + (q.adults + q.kids > 1 ? 's' : '')].filter(Boolean).join(' · ')) + '</div>' +
        '<h2>' + esc(d.name) + '</h2>' + (d.why ? '<p>' + esc(d.why) + '</p>' : '') +
        (d.tags && d.tags.length ? '<div class="tags">' + d.tags.map((x) => '<span>' + esc(x) + '</span>').join('') + '</div>' : '') + '</div>';

      // colonne principale : transports, hébergements, programme
      let main = '<section class="card glass"><h3>' + svg('plane') + 'Se rendre à ' + esc(d.name) + '<small>prix estimés</small></h3>';
      main += (d.transport || []).map((o, k) => '<div class="opt soft"><div class="mi">' + svg(MODE_IC[o.mode] || 'plane') + '</div>' +
        '<div><div class="tt">' + esc((o.mode || '').replace(/^./, (c) => c.toUpperCase())) + ' · ' + esc(o.from || q.from) + ' → ' + esc(o.to || d.name) + '</div>' +
        '<div class="mt">' + esc([o.duration, o.per].filter(Boolean).join(' · ')) + '</div>' + (o.details ? '<div class="ds">' + esc(o.details) + '</div>' : '') + '</div>' +
        '<div class="pr"><b>' + (o.price_min ? eur(o.price_min) : '') + (o.price_max && o.price_max !== o.price_min ? ' – ' + eur(o.price_max) : '') + '</b><small>' + esc(o.per || '') + '</small></div>' +
        '<div class="links">' + linkHtml(transportLinks(o)) + '<button class="agent" data-agent="t' + k + '">' + svg('bot') + 'L’agent cherche le meilleur prix</button></div></div>').join('');
      main += '</section>';
      main += '<section class="card glass"><h3>' + svg('hotel') + 'Où dormir<small>' + (n ? n + ' nuit' + (n > 1 ? 's' : '') : '') + '</small></h3>';
      main += (d.lodging || []).map((o, k) => '<div class="opt soft"><div class="mi">' + svg(STAY_IC[o.type] || 'hotel') + '</div>' +
        '<div><div class="tt">' + esc((o.type || '').replace(/^./, (c) => c.toUpperCase())) + (o.area ? ' · ' + esc(o.area) : '') + '</div>' + (o.why ? '<div class="ds">' + esc(o.why) + '</div>' : '') + '</div>' +
        '<div class="pr"><b>' + (o.price_night_min ? eur(o.price_night_min) : '') + (o.price_night_max ? ' – ' + eur(o.price_night_max) : '') + '</b><small>par nuit' + (n && o.price_night_min ? ' · ' + eur(o.price_night_min * n) + ' et +' : '') + '</small></div>' +
        '<div class="links">' + linkHtml(lodgingLinks(o, d)) + '<button class="agent" data-agent="l' + k + '">' + svg('bot') + 'L’agent compare les logements</button></div></div>').join('');
      main += '</section>';
      const days = trip.days[sel] || {};
      main += '<section class="card glass"><h3>' + svg('cal') + 'Programme jour par jour<small>' + (days.loading ? 'en préparation par une deuxième session d’IA…' : '') + '</small></h3>';
      if (days.list) {
        main += '<div class="days">' + days.list.map((x, k) => '<div class="day" data-n="' + (x.day || k + 1) + '"><b>' + esc(x.title || 'Jour ' + (k + 1)) + '</b>' + (x.area ? '<small>' + esc(x.area) + '</small>' : '') +
          '<ul>' + (x.items || []).map((it) => '<li>' + esc(it) + '</li>').join('') + '</ul></div>').join('') + '</div>';
      } else if (days.error) main += '<p style="color:var(--fg-dim);font-size:13.5px">Le programme n’a pas pu être préparé. <button class="pill" data-act="days" style="height:30px">Réessayer</button></p>';
      else main += '<div class="sk" style="width:40%"></div><div class="sk"></div><div class="sk" style="width:80%"></div><div class="sk" style="width:55%"></div><div class="sk"></div>';
      main += '</section>';

      // colonne de côté : budget, météo, conseils
      let side = '';
      const b = d.budget || {};
      const parts = [['Transport', b.transport], ['Hébergement', b.lodging], ['Repas', b.food], ['Activités', b.activities], ['Sur place', b.local]].filter((x) => x[1] > 0);
      const sum = b.total || parts.reduce((a, x) => a + x[1], 0);
      if (sum) {
        const ok = q.budget >= 10000 || sum <= q.budget;
        side += '<section class="card glass"><h3>' + svg('wallet') + 'Budget estimé<small>pour ' + (q.adults + q.kids) + ' pers.</small></h3><div class="bar">' +
          parts.map((x, k) => '<i style="width:' + (x[1] / sum * 100).toFixed(1) + '%;background:' + COLORS[k] + '"></i>').join('') + '</div><div class="leg">' +
          parts.map((x, k) => '<i style="background:' + COLORS[k] + '"></i><span>' + x[0] + '</span><b>' + eur(x[1]) + '</b>').join('') + '</div>' +
          '<div class="tot"><b>' + eur(sum) + '</b><small class="' + (ok ? 'ok' : 'ko') + '">' + (q.budget >= 10000 ? 'sans limite' : ok ? 'dans votre budget (' + eur(q.budget) + ')' : eur(sum - q.budget) + ' au-dessus du budget') + '</small></div></section>';
      }
      const wx = trip.wx[sel];
      if (wx) {
        const avgMax = wx.days.reduce((a, x) => a + (x.max || 0), 0) / wx.days.length, rainy = wx.days.filter((x) => x.rain > 1).length;
        side += '<section class="card glass"><h3>' + svg('sun') + 'Météo<small>' + esc(wx.place) + '</small></h3><div class="wx">' +
          wx.days.map((x) => '<div class="wd"><small>' + new Date(x.date).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric' }) + '</small><div class="e">' + WX(x.code) + '</div><b>' + Math.round(x.max) + '°</b><small>' + Math.round(x.min) + '°</small></div>').join('') +
          '</div><p class="wnote">' + (wx.mode === 'f' ? 'Prévisions pour vos dates.' : 'Relevés aux mêmes dates l’an dernier, pour se faire une idée.') + ' Environ ' + Math.round(avgMax) + ' °C l’après-midi, ' + rainy + ' jour' + (rainy > 1 ? 's' : '') + ' de pluie.</p></section>';
      }
      if (d.tips && d.tips.length) side += '<section class="card glass"><h3>' + svg('bulb') + 'Bon à savoir</h3><ul class="tips">' + d.tips.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></section>';

      h += '<div class="cols"><div>' + main + '</div><div class="side">' + side + '</div></div>';
      h += '<form class="refine glass" id="refine"><input id="refine-in" placeholder="Ajuster : moins cher, plus de nature, un autre pays, partir plus tôt…"><div class="chips">' +
        ['Moins cher', 'Plus confortable', 'Plus nature', 'Autres idées'].map((x) => '<button type="button" data-ref="' + x + '">' + x + '</button>').join('') + '</div><button class="btn" style="height:40px">Ajuster</button></form>';
      $('result').innerHTML = h;
      $('result').classList.add('on');
      $('progress').classList.remove('on');
    }

    // ------------------------------------------------------------ actions
    $('result').addEventListener('click', (e) => {
      const dst = e.target.closest('[data-dest]');
      if (dst) { sel = +dst.dataset.dest; render(); enrich(sel); return; }
      const ag = e.target.closest('[data-agent]');
      if (ag) { e.preventDefault(); agent(ag.dataset.agent); return; }
      const act = e.target.closest('[data-act]');
      if (act) {
        e.preventDefault();
        if (act.dataset.act === 'save') save();
        else if (act.dataset.act === 'pop') detach();
        else if (act.dataset.act === 'days') { delete trip.days[sel]; enrich(sel); render(); }
        else if (act.dataset.act === 'add') { adding = 'form'; render(); setTimeout(() => { const i = $('add-in'); if (i) i.focus(); }, 30); }
        else if (act.dataset.act === 'add-x') { adding = null; render(); }
        return;
      }
      const ref = e.target.closest('[data-ref]');
      if (ref) { refine(ref.dataset.ref); return; }
      const a = e.target.closest('a[href]');
      // liens : nouvel onglet, la page du voyage reste ouverte
      if (a && /^https?:/.test(a.href)) { e.preventDefault(); C.invoke('new_tab', { url: a.href }); }
    });
    $('result').addEventListener('submit', (e) => { if (e.target.id === 'add-form') { e.preventDefault(); addDest($('add-in').value.trim()); return; } if (e.target.id === 'refine') { e.preventDefault(); const v = $('refine-in').value.trim(); if (v) refine(v); } });
    // « + » : l'IA ajoute une destination de plus (celle demandée, ou une nouvelle idée)
    let adding = null; // null | 'form' | 'busy' | {err}
    function addBox() {
      if (adding === 'busy') return '<div class="add-dest busy" title="L’IA prépare une nouvelle destination…"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg></div>';
      if (adding === 'form' || (adding && adding.err)) return '<form class="add-form" id="add-form"><b>Ajouter une destination</b><input id="add-in" placeholder="Ville, pays ou envie (vide : idée de l’IA)" autocomplete="off">' +
        (adding.err ? '<span class="add-err">' + esc(adding.err) + '</span>' : '') + '<div class="row"><button type="button" class="no" data-act="add-x">Annuler</button><button class="ok">Ajouter</button></div></form>';
      return '<button class="add-dest" data-act="add" title="Demander à l’IA une autre destination"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>';
    }
    async function addDest(hint) {
      if (!trip || adding === 'busy') return;
      const t0 = trip, names = t0.r.destinations.map((x) => x.name);
      adding = 'busy';
      render();
      const q = Object.assign({}, t0.q, { to: hint || '', refine: t0.q.refine.concat([hint ? 'ajoute cette destination : ' + hint : 'propose UNE nouvelle destination différente de : ' + names.join(', ')]) });
      try {
        const txt = await ask(planPrompt(q, true), 1, 150000);
        const j = json(txt), d = j && Array.isArray(j.destinations) && j.destinations[0];
        if (!d || !d.name) throw 'réponse de l’IA illisible';
        if (trip !== t0) return;
        t0.r.destinations.push(d);
        adding = null;
        sel = t0.r.destinations.length - 1;
        t0.saved = false;
        render();
        enrich(sel);
      } catch (e) {
        if (trip === t0) { adding = { err: 'Échec : ' + e }; render(); }
      }
    }

    function refine(t) {
      if (!trip) return;
      const q = Object.assign({}, trip.q, { refine: trip.q.refine.concat([t === 'Autres idées' ? 'propose d’autres destinations que ' + trip.r.destinations.map((x) => x.name).join(', ') : t]) });
      if (t === 'Autres idées') q.to = '';
      run(q);
    }
    // l'agent ouvre le site dans un nouvel onglet et y cherche lui-même le meilleur prix
    function agent(key) {
      const d = trip.r.destinations[sel], dt = tripDates(), q = trip.q, who = q.adults + ' adulte(s)' + (q.kids ? ' et ' + q.kids + ' enfant(s)' : '');
      const when = dt.start ? ' du ' + dt.start + (dt.end ? ' au ' + dt.end : '') : '';
      let url, goal;
      if (key[0] === 't') {
        const o = d.transport[+key.slice(1)];
        url = (transportLinks(o)[0] || [])[1] || C.searchUrl(o.mode + ' ' + (o.from || q.from) + ' ' + (o.to || d.name), 'corrtex');
        goal = 'Trouve l’option de ' + o.mode + ' la moins chère et la plus pratique de ' + (o.from || q.from) + ' à ' + (o.to || d.name) + when + ' pour ' + who + '. Donne le prix total, les horaires et la compagnie.';
      } else {
        const o = d.lodging[+key.slice(1)];
        url = lodgingLinks(o, d)[0][1];
        goal = 'Compare les ' + (o.type === 'airbnb' ? 'logements Airbnb' : 'hébergements') + ' à ' + d.name + (o.area ? ' (quartier ' + o.area + ')' : '') + when + ' pour ' + who +
          (o.price_night_max ? ', jusqu’à environ ' + o.price_night_max + ' € la nuit' : '') + '. Donne les 3 meilleures options avec prix total, note et lien.';
      }
      C.invoke('new_tab', { url }).then(() => setTimeout(() => C.invoke('agent_start', { goal }), 1800));
    }
    function detach() {
      const html = $('result').querySelector('.cols').outerHTML;
      const d = trip.r.destinations[sel];
      C.invoke('reader_open', { title: 'Voyage à ' + d.name, html: '<h1 style="font:700 30px Georgia,serif;margin-bottom:12px">Voyage à ' + esc(d.name) + '</h1>' + html });
    }

    // ------------------------------------------------------------ mes voyages (gardés sur cet ordinateur)
    const loadSaved = () => { try { return JSON.parse(localStorage.getItem('corrtex.trips') || '[]'); } catch (e) { return []; } };
    const storeSaved = (l) => { try { localStorage.setItem('corrtex.trips', JSON.stringify(l.slice(0, 30))); } catch (e) {} };
    function save() {
      const l = loadSaved().filter((x) => x.id !== trip.id);
      l.unshift({ id: trip.id, at: Date.now(), q: trip.q, r: trip.r, days: Object.fromEntries(Object.entries(trip.days).filter(([, v]) => v.list)), img: trip.img });
      storeSaved(l);
      trip.saved = true;
      render();
      drawSaved();
    }
    function drawSaved() {
      const l = loadSaved();
      $('saved-list').innerHTML = l.length ? l.map((x) => {
        const d = x.r.destinations[0] || {};
        return '<button class="sv" data-trip="' + x.id + '"><span class="th"' + (x.img && x.img[0] ? ' style="background-image:url(\'' + esc(x.img[0]) + '\')"' : '') + '></span><span><b>' +
          esc(x.r.destinations.map((y) => y.name).join(' · ')) + '</b><small>' + esc(x.q.wish || '').slice(0, 60) + '<br>' + new Date(x.at).toLocaleDateString('fr-FR') + '</small></span>' +
          '<span class="x" data-del="' + x.id + '" title="Supprimer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span></button>';
      }).join('') : '<p style="color:var(--fg-dim);font-size:13.5px">Aucun voyage enregistré. Préparez un voyage puis cliquez sur « Enregistrer ».</p>';
    }
    $('saved-btn').onclick = () => { drawSaved(); $('saved').classList.toggle('open'); };
    $('saved-x').onclick = () => $('saved').classList.remove('open');
    $('saved-list').addEventListener('click', (e) => {
      const del = e.target.closest('[data-del]');
      if (del) { e.stopPropagation(); storeSaved(loadSaved().filter((x) => String(x.id) !== del.dataset.del)); drawSaved(); return; }
      const b = e.target.closest('[data-trip]');
      if (!b) return;
      const x = loadSaved().find((y) => String(y.id) === b.dataset.trip);
      if (!x) return;
      trip = { id: x.id, q: x.q, r: x.r, days: x.days || {}, img: x.img || {}, wx: {}, saved: true };
      adding = null;
      sel = 0;
      $('saved').classList.remove('open');
      render();
      enrich(0);
      $('result').scrollIntoView({ behavior: 'smooth' });
    });

    // ------------------------------------------------------------ demande venue de la recherche IA (/voyage …)
    const hq = new URLSearchParams(location.hash.slice(1)).get('q');
    if (hq) { wish.value = hq; grow(); setTimeout(() => $('form').requestSubmit(), 200); }
    else setTimeout(() => wish.focus(), 100);
  })();
  </script>
</body>
</html>
